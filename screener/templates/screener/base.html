{% load static %}
<!DOCTYPE html>
<html lang="ru" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recon&Scalp</title>
    <link rel="icon" type="image/png" href="/api/logo/">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&display=swap" rel="stylesheet">
    <link href="{% static 'screener/styles.css' %}" rel="stylesheet">
    <link href="{% static 'screener/css/densities_dashboard.css' %}" rel="stylesheet">
</head>
<body>
    {% block content %}{% endblock %}

    <!-- Search Modal -->
    <div id="searchModal" class="search-modal">
        <div class="search-modal-backdrop"></div>
        <div class="search-modal-content">
            <div class="search-modal-header">
                <span class="search-modal-title">Поиск монеты</span>
                <kbd class="search-modal-hint">ESC — закрыть</kbd>
            </div>
            <div class="search-modal-input-wrapper">
                <input type="text" id="searchInput" class="search-modal-input" placeholder="Введите символ монеты (BTC, ETH...)" autocomplete="off" spellcheck="false">
            </div>
            <div id="searchDropdown" class="search-modal-dropdown"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="{% static 'screener/js/state_core.js' %}"></script>
    <script src="{% static 'screener/js/utils.js' %}"></script>
    <script src="{% static 'screener/js/sound.js' %}"></script>
    <script src="{% static 'screener/js/slider.js' %}"></script>
    <script src="{% static 'screener/js/impulse_ws.js' %}"></script>
    <script src="{% static 'screener/js/alert_manager.js' %}"></script>
    <script src="{% static 'screener/js/data_loading.js' %}"></script>
    <script src="{% static 'screener/js/search.js' %}"></script>
    <script src="{% static 'screener/js/table.js' %}"></script>
    <script src="{% static 'screener/js/candle_ws.js' %}"></script>
    <script src="{% static 'screener/js/trades.js' %}"></script>
    <script src="{% static 'screener/js/densities.js' %}"></script>
    <script src="{% static 'screener/js/drawings.js' %}"></script>
    <script src="{% static 'screener/js/recon.js' %}"></script>
    <script src="{% static 'screener/js/scalp.js' %}"></script>
    <script src="{% static 'screener/js/coin_groups.js' %}"></script>
    <script src="{% static 'screener/js/collage.js' %}"></script>
    <script src="{% static 'screener/js/chart.js' %}"></script>
    <script src="{% static 'screener/js/settings.js' %}"></script>
    <script src="{% static 'screener/js/init.js' %}"></script>
    <script src="{% static 'screener/js/context_menu.js' %}"></script>
</body>
</html>
