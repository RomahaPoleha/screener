{% extends 'screener/base.html' %}
{% load static %}

{% block content %}
<div class="container d-flex align-items-center justify-content-center min-vh-100">
    <div class="card shadow-sm w-100" style="max-width: 420px;">
        <div class="card-body p-4 p-md-5 text-center">
            <div class="mb-4">
                <img src="{% url 'api_logo' %}" alt="Logo" height="56" class="mb-3">
            </div>

            <div class="mb-4">
                <div class="d-inline-flex align-items-center justify-content-center bg-success-subtle text-success rounded-circle" style="width:80px; height:80px;">
                    <svg width="36" height="36" fill="currentColor" viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/></svg>
                </div>
            </div>

            <h3 class="fw-bold mb-2">Email подтверждён!</h3>
            <p class="text-muted mb-4">Твой аккаунт активирован. Теперь можешь войти.</p>

            <a href="{% url 'login' %}" class="btn btn-primary btn-lg w-100" style="background:#f59e0b; border:none; color:#000; font-weight:700; text-transform:uppercase; letter-spacing:0.5px;">Войти</a>
        </div>
    </div>
</div>

<style>
    .min-vh-100 { min-height: 100vh; }
</style>
{% endblock %}
