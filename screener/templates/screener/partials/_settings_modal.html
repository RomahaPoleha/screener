<!-- Модальное окно настроек -->
<div class="modal fade" id="settingsModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content" style="background:#151b2b; border:1px solid #2d3748; color:#d1d5db;">
            <div class="modal-header" style="border-bottom:1px solid #2d3748;">
                <h5 class="modal-title">⚙️ Настройки</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="modal-section">
                    <div class="modal-section-title">🔊 Голосовое оповещение</div>
                    <button class="sound-toggle" id="soundToggleModal" onclick="toggleSound()" style="width:100%; padding:8px; font-size:13px;">
                         Голосовое оповещение
                    </button>
                </div>
                <div class="modal-section">
                    <div class="modal-section-title">🎨 Инструменты рисования</div>
                    <div style="margin-bottom:12px;">
                        <label style="display:flex; align-items:center; gap:6px; cursor:pointer; font-size:13px; color:#d1d5db; margin-bottom:8px;">
                            <input type="checkbox" id="showDrawingTools" checked onchange="toggleDrawingToolsVisibility()" style="accent-color:#f0b90b; width:16px; height:16px;">
                            <span>Показывать панель инструментов</span>
                        </label>
                    </div>
                </div>
                <div class="modal-section">
                    <div class="modal-section-title">📊 Панель рекона</div>
                    <div class="form-check form-switch mb-2" style="margin-bottom:0;">
                        <input class="form-check-input" type="checkbox" id="reconPanelToggle" onchange="toggleReconSettings()" style="accent-color:#f0b90b; width:16px; height:16px;">
                        <label class="form-check-label" for="reconPanelToggle" style="font-size:13px; color:#d1d5db;">Панель рекона (сырые стаканы)</label>
                    </div>
                </div>
                <div id="reconSettingsSection" style="display:none;">
                    <div class="modal-section">
                        <div class="modal-section-title">🔍 RECON — мин. объём по биржам (USDT)</div>
                        <div id="reconSettingsContainer" style="display:flex; flex-direction:column; gap:10px;"></div>
                    </div>
                </div>
                <div class="modal-section">
                    <div class="modal-section-title">🎯 Scalp — Мониторинг плотностей</div>
                    <button type="button" id="openScalpSettingsBtn"
                        style="width:100%; padding:10px; background:#2d3748; color:#f0b90b; border:1px solid #f0b90b; border-radius:8px; cursor:pointer; font-size:13px; font-weight:600;">
                        ⚙️ Scalp настройки (биржи и объёмы)
                    </button>
                </div>
                <div class="modal-section">
                    <label style="display:flex; align-items:center; gap:6px; cursor:pointer; font-size:13px; color:#d1d5db;">
                        <input type="checkbox" id="showVolumeHistogram" checked style="accent-color:#f0b90b; width:16px; height:16px;">
                        <span>Показывать гистограмму объёма</span>
                    </label>
                </div>
            </div>
            <div class="modal-footer" style="border-top:1px solid #2d3748;">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" style="background:#2d3748; border:none; color:#d1d5db;">Закрыть</button>
                <button type="button" class="btn btn-primary" onclick="applySettings()" style="background:#f0b90b; border:none; color:#000; font-weight:600;">Применить</button>
            </div>
        </div>
    </div>
</div>

<!-- Отдельное окно Scalp настроек -->
<div class="modal fade" id="scalpSettingsModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content" style="background:#151b2b; border:1px solid #2d3748; color:#d1d5db;">
            <div class="modal-header" style="border-bottom:1px solid #2d3748;">
                <h5 class="modal-title" style="color:#f0b90b;">⚡ Scalp настройки</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="scalpExchangesContainer"
                 style="display:flex; flex-direction:column; gap:14px;"></div>
            <div class="modal-footer" style="border-top:1px solid #2d3748;">
                <div style="font-size:11px; color:#9ca3af; line-height:1.6; margin-right:auto;">
                    <span style="color:#fbbf24;">🟡 Жёлтый</span> — плотность до 500K<br>
                    <span style="color:#ba55d3;">🟣 Фиолетовый</span> — плотность от 500K
                </div>
                <button type="button" class="btn btn-primary" id="applyScalpSettingsBtn"
                    style="background:#f0b90b; border:none; color:#000; font-weight:600;">Сохранить</button>
            </div>
        </div>
    </div>
</div>
