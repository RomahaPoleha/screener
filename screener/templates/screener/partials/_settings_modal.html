<!-- Модальное окно настроек -->
<div class="modal fade" id="settingsModal" tabindex="-1" aria-hidden="true">
<div class="modal-dialog modal-dialog-centered" style="max-width: 1000px;">
<div class="modal-content" style="background:#1a1a1a; border:1px solid #333333; color:#e5e5e5;">
<div class="modal-header" style="border-bottom:1px solid #333333;">
<h5 class="modal-title" style="color:#ffffff; font-weight:700; letter-spacing:0.5px; text-transform:uppercase;">Настройки</h5>
<button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
</div>
<div class="modal-body" style="padding:0; display:flex; min-height:440px;">
<!-- ЛЕВАЯ СТОРОНА: навигация по разделам -->
<div class="settings-nav">
<button type="button" class="settings-nav-item active" data-tab="display">Отображение</button>
<button type="button" class="settings-nav-item" data-tab="recon-scalp">Recon & Scalp</button>
<button type="button" class="settings-nav-item" data-tab="alerts">Оповещения</button>
</div>
<!-- ПРАВАЯ СТОРОНА: содержимое раздела -->
<div class="settings-content">
<!-- ОТОБРАЖЕНИЕ -->
<div class="settings-tab-content active" id="tab-display">
<div class="modal-section">
<div class="modal-section-title">График</div>
<label style="display:flex; align-items:center; gap:8px; cursor:pointer; font-size:13px; color:#e5e5e5; margin-bottom:10px;">
<input type="checkbox" id="showVolumeHistogram" checked style="accent-color:#f59e0b; width:16px; height:16px;">
<span>Показывать гистограмму объёма</span>
</label>
</div>
<div class="modal-section">
<div class="modal-section-title">Инструменты рисования</div>
<label style="display:flex; align-items:center; gap:8px; cursor:pointer; font-size:13px; color:#e5e5e5;">
<input type="checkbox" id="showDrawingTools" checked onchange="toggleDrawingToolsVisibility()" style="accent-color:#f59e0b; width:16px; height:16px;">
<span>Показывать панель инструментов</span>
</label>
</div>
</div>
<!-- RECON & SCALP -->
<div class="settings-tab-content" id="tab-recon-scalp">
<div style="display:flex; gap:3px; align-items:flex-start;">
<!-- RECON (слева) -->
<div style="flex:1; min-width:0;">
<div class="modal-section" style="margin-bottom:12px; padding-bottom:12px;">
<div class="modal-section-title" style="margin-bottom:8px;">Recon</div>
<label style="display:flex; align-items:center; gap:8px; cursor:pointer; font-size:12px; color:#e5e5e5; margin-bottom:10px;">
<input type="checkbox" id="reconPanelToggle" style="accent-color:#f59e0b; width:14px; height:14px;">
<span>Показывать панель рекона на графике</span>
</label>
<div class="modal-section-title" style="font-size:10px; color:#999999; margin-bottom:8px;">Мин. объём (USDT)</div>
<div id="reconSettingsContainer" style="display:flex; flex-direction:column; gap:6px;"></div>
</div>
</div>
<!-- SCALP (справа) -->
<div style="flex:1; min-width:0;">
<div class="modal-section" style="margin-bottom:0;">
<div class="modal-section-title" style="margin-bottom:8px;">Scalp</div>
    <br>
<div class="modal-section-title" style="font-size:10px; color:#999999; margin-bottom:8px;">Мин. объём (USDT)</div>
<div id="scalpExchangesContainer" style="display:flex; flex-direction:column; gap:6px;"></div>
</div>
</div>
</div>
</div>
<!-- ОПОВЕЩЕНИЯ -->
<div class="settings-tab-content" id="tab-alerts">
<div class="modal-section">
    <div class="modal-section-title">Импульс</div>
    <label style="display:flex; align-items:center; gap:8px; cursor:pointer; font-size:13px; color:#e5e5e5; margin-bottom:12px;">
        <input type="checkbox" id="volumeAlertToggle" style="accent-color:#f59e0b; width:16px; height:16px;">
        <span>Включить технологию «Импульс»</span>
    </label>
    <label style="display:flex; align-items:center; gap:8px; font-size:13px; color:#e5e5e5; margin-bottom:10px;">
        <span style="color:#999999; min-width:170px;">Движение цены (%):</span>
        <input type="number" id="priceImpulseThreshold" value="1" min="0.1" step="0.1"
            style="width:70px; background:#0f0f0f; border:1px solid #444444; color:#ffffff; padding:4px 8px; border-radius:0; font-size:12px;">
    </label>
    <label style="display:flex; align-items:center; gap:8px; font-size:13px; color:#e5e5e5; margin-bottom:10px;">
        <span style="color:#999999; min-width:170px;">Окно времени (сек):</span>
        <input type="number" id="priceImpulseWindow" value="60" min="1" max="5" step="1"
            style="width:70px; background:#0f0f0f; border:1px solid #444444; color:#ffffff; padding:4px 8px; border-radius:0; font-size:12px;">
    </label>
    <label style="display:flex; align-items:center; gap:8px; font-size:13px; color:#e5e5e5; margin-bottom:10px;">
        <span style="color:#999999; min-width:170px;">Громкость оповещения:</span>
        <input type="range" id="alertBeepVolume" min="0" max="1" step="0.05" style="flex:1; accent-color:#f59e0b;">
    </label>
    <p style="font-size:10px; color:#666666; margin:0; line-height:1.5;">
        Алерт сработает когда цена изменится на указанный % за окно времени.
        Звук выключается слайдером громкости в ноль.
    </p>
</div>
<div class="modal-section">
<div class="modal-section-title">Часовые звуки</div>
<label style="display:flex; align-items:center; gap:8px; cursor:pointer; font-size:13px; color:#e5e5e5; margin-bottom:10px;">
<input type="checkbox" id="soundToggleModal" onchange="toggleSound()" style="accent-color:#f59e0b; width:16px; height:16px;">
<span>Оповещения за 5 и 1 минуту до нового часа</span>
</label>
<label style="display:flex; align-items:center; gap:8px; font-size:13px; color:#e5e5e5;">
<span style="color:#999999; min-width:170px;">Громкость звука:</span>
<input type="range" id="hourSoundVolume" min="0" max="1" step="0.05" style="flex:1; accent-color:#f59e0b;">
</label>
</div>
</div>
</div>
</div>
<div class="modal-footer" style="border-top:1px solid #333333;">
<button type="button" class="btn btn-secondary" data-bs-dismiss="modal" style="background:#2a2a2a; border:none; color:#ffffff; border-radius:0; text-transform:uppercase; letter-spacing:0.5px;">Закрыть</button>
<button type="button" class="btn btn-primary" onclick="applySettings()" style="background:#f59e0b; border:none; color:#000000; font-weight:700; border-radius:0; text-transform:uppercase; letter-spacing:0.5px;">Применить</button>
</div>
</div>
</div>
</div>
<!-- Модалка групп монет -->
<div class="modal fade" id="coinGroupsModal" tabindex="-1" aria-hidden="true">
<div class="modal-dialog modal-dialog-centered">
<div class="modal-content" style="background:#1a1a1a; border:1px solid #333333; color:#e5e5e5;">
<div class="modal-header" style="border-bottom:1px solid #333333;">
<h5 class="modal-title" style="color:#ffffff; font-weight:700; text-transform:uppercase; letter-spacing:0.5px;">Группы монет</h5>
<button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
</div>
<div class="modal-body" id="coinGroupsBody" style="max-height:400px; overflow-y:auto;"></div>
</div>
</div>
</div>
<!-- Тултип объёма -->
<div id="volumeTooltip" class="volume-tooltip"></div>
