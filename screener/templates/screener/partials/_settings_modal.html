<!-- Модальное окно настроек -->
<div class="modal fade" id="settingsModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" style="max-width: 560px;">
        <div class="modal-content" style="background:#1a1a1a; border:1px solid #333333; color:#e5e5e5;">
            <div class="modal-header" style="border-bottom:1px solid #333333;">
                <h5 class="modal-title" style="color:#ffffff; font-weight:700; letter-spacing:0.5px; text-transform:uppercase;">Настройки</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" style="padding-top: 0;">
                <div class="settings-tabs">
                    <button type="button" class="settings-tab active" data-tab="display">Отображение</button>
                    <button type="button" class="settings-tab" data-tab="data">Данные</button>
                    <button type="button" class="settings-tab" data-tab="alerts">Оповещения</button>
                </div>

                <div class="settings-tab-content active" id="tab-display">
                    <div class="modal-section">
                        <div class="modal-section-title">График</div>
                        <label style="display:flex; align-items:center; gap:8px; cursor:pointer; font-size:13px; color:#e5e5e5; margin-bottom:10px;">
                            <input type="checkbox" id="showVolumeHistogram" checked style="accent-color:#f59e0b; width:16px; height:16px;">
                            <span>Показывать гистограмму объёма</span>
                        </label>
                        <label style="display:flex; align-items:center; gap:8px; cursor:pointer; font-size:13px; color:#e5e5e5;">
                            <input type="checkbox" id="showDeltaHistogram" checked style="accent-color:#f59e0b; width:16px; height:16px;">
                            <span>Показывать дельту покупок/продаж</span>
                        </label>
                    </div>
                    <div class="modal-section">
                        <div class="modal-section-title">Инструменты рисования</div>
                        <label style="display:flex; align-items:center; gap:8px; cursor:pointer; font-size:13px; color:#e5e5e5;">
                            <input type="checkbox" id="showDrawingTools" checked onchange="toggleDrawingToolsVisibility()" style="accent-color:#f59e0b; width:16px; height:16px;">
                            <span>Показывать панель инструментов</span>
                        </label>
                    </div>
                </div>

                <div class="settings-tab-content" id="tab-data">
                    <div class="modal-section">
                        <div class="modal-section-title">Панель рекона (сырые данные)</div>
                        <label style="display:flex; align-items:center; gap:8px; cursor:pointer; font-size:13px; color:#e5e5e5;">
                            <input type="checkbox" id="reconPanelToggle" onchange="toggleReconSettings()" style="accent-color:#f59e0b; width:16px; height:16px;">
                            <span>Показывать панель рекона</span>
                        </label>
                    </div>
                    <div id="reconSettingsSection" style="display:none;">
                        <div class="modal-section">
                            <div class="modal-section-title" style="font-size:12px; color:#999999;">Мин. объём по биржам (USDT)</div>
                            <div id="reconSettingsContainer" style="display:flex; flex-direction:column; gap:10px;"></div>
                        </div>
                    </div>
                    <div class="modal-section">
                    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;">
                        <div class="modal-section-title" style="margin-bottom:0;">Scalp мониторинг</div>
                        <button type="button" id="openScalpSettingsBtn"
                            style="padding:4px 10px; background:#2a2a2a; color:#999999; border:1px solid #444444; border-radius:0; cursor:pointer; font-size:11px; font-weight:600; transition:all 0.2s; text-transform:uppercase; letter-spacing:0.5px;">
                            Настройки
                        </button>
                    </div>
                    <p style="font-size:12px; color:#999999; margin-bottom:0; line-height:1.5;">
                        Фильтрованные плотности с нескольких бирж
                    </p>
                </div>
                </div>

                <div class="settings-tab-content" id="tab-alerts">
                    <div class="modal-section">
                    <div class="modal-section-title">Голосовое оповещение</div>
                    <label style="display:flex; align-items:center; gap:8px; cursor:pointer; font-size:13px; color:#e5e5e5;">
                        <input type="checkbox" id="soundToggleModal" onchange="toggleSound()" style="accent-color:#f59e0b; width:16px; height:16px;">
                        <span>Озвучивать предупреждения за 5 и 1 минуту до нового часа</span>
                    </label>
                </div>
                </div>
            </div>
            <div class="modal-footer" style="border-top:1px solid #333333;">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" style="background:#2a2a2a; border:none; color:#ffffff; border-radius:0; text-transform:uppercase; letter-spacing:0.5px;">Закрыть</button>
                <button type="button" class="btn btn-primary" onclick="applySettings()" style="background:#f59e0b; border:none; color:#000000; font-weight:700; border-radius:0; text-transform:uppercase; letter-spacing:0.5px;">Применить</button>
            </div>
        </div>
    </div>
</div>

<!-- Отдельное окно Scalp настроек -->
<div class="modal fade" id="scalpSettingsModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content" style="background:#1a1a1a; border:1px solid #333333; color:#e5e5e5;">
            <div class="modal-header" style="border-bottom:1px solid #333333;">
                <h5 class="modal-title" style="color:#ffffff; font-weight:700; text-transform:uppercase; letter-spacing:0.5px;">Scalp настройки</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="scalpExchangesContainer"
                 style="display:flex; flex-direction:column; gap:14px;"></div>
            <div class="modal-footer" style="border-top:1px solid #333333;">
                <div style="font-size:11px; color:#999999; line-height:1.6; margin-right:auto;">
                    <span style="color:#ffffff;">&#9632;</span> Светлый — плотность до 500K<br>
                    <span style="color:#666666;">&#9632;</span> Тёмный — плотность от 500K
                </div>
                <button type="button" class="btn btn-primary" id="applyScalpSettingsBtn"
                    style="background:#f59e0b; border:none; color:#000000; font-weight:700; border-radius:0; text-transform:uppercase; letter-spacing:0.5px;">Сохранить</button>
            </div>
        </div>
    </div>
</div>
