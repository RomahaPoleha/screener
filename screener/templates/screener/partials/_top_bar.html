<div class="top-bar">
    <div style="background: #1a1a1a; padding: 8px 16px; border-radius: 0; text-align: center; display: flex; align-items: center; justify-content: center; gap: 8px; position: relative; overflow: hidden;">
  <style>
    @keyframes fire-flicker {
      0%, 100% { opacity: 1; text-shadow: 0 0 10px rgba(255, 100, 0, 0.8), 0 0 30px rgba(255, 50, 0, 0.4); }
      25% { opacity: 0.9; text-shadow: 0 0 15px rgba(255, 100, 0, 1), 0 0 40px rgba(255, 50, 0, 0.6); }
      50% { opacity: 1; text-shadow: 0 0 20px rgba(255, 100, 0, 1), 0 0 50px rgba(255, 50, 0, 0.8); }
      75% { opacity: 0.95; text-shadow: 0 0 12px rgba(255, 100, 0, 0.9), 0 0 35px rgba(255, 50, 0, 0.5); }
    }
    @keyframes fire-bg {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.5; }
    }
  </style>
  <div style="position: absolute; bottom: 0; left: 0; right: 0; height: 33%; background: radial-gradient(ellipse at bottom, #ff4500 0%, #ff8c00 30%, transparent 70%); animation: fire-bg 2s ease-in-out infinite;"></div>
  <span style="
    font-family: 'Montserrat', sans-serif;
    font-size: 1.3rem;
    font-weight: 900;
    letter-spacing: 0.1em;
    background: linear-gradient(180deg, #fff5e6 0%, #ffcc00 20%, #ff6600 50%, #cc0000 80%, #660000 100%);
    background-clip: text;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
    animation: fire-flicker 1.5s ease-in-out infinite;
    position: relative;
  ">RECON</span>
  <span style="
    background: linear-gradient(180deg, #fff 0%, #ffcc00 50%, #ff4500 100%);
    background-clip: text;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
    font-size: 1rem;
    font-weight: bold;
    animation: fire-flicker 1.5s ease-in-out infinite 0.2s;
    position: relative;
  ">&</span>
  <span style="
    font-family: 'Montserrat', sans-serif;
    font-size: 1.3rem;
    font-weight: 900;
    letter-spacing: 0.1em;
    background: linear-gradient(180deg, #fff5e6 0%, #ffcc00 20%, #ff6600 50%, #cc0000 80%, #660000 100%);
    background-clip: text;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
    animation: fire-flicker 1.5s ease-in-out infinite 0.3s;
    position: relative;
  ">SCALP</span>
</div>

    <div style="margin-left:auto; display:flex; gap:8px; align-items:center;">
        <!-- История алертов (крайняя слева из трёх, видна только когда включена) -->
        <div id="alertHistoryWrap" style="position:relative; display:none;">
            <button class="sound-toggle" id="alertHistoryBtn" onclick="toggleAlertHistory()">
                АЛЕРТЫ <span id="alertBadge" class="alert-badge">0</span>
            </button>
            <div id="alertHistoryPanel" class="alert-history-panel">
                <div class="alert-history-header">История алертов</div>
                <div id="alertHistoryBody" class="alert-history-body"></div>
            </div>
        </div>

        <!-- Крупные сделки -->
        <button class="sound-toggle" id="tradesBtn" onclick="toggleTradesOverlay()" style="font-size:14px;">💰 Крупные сделки</button>

        <!-- Настройки (крайняя справа) -->
        <button class="sound-toggle" id="settingsBtn" onclick="openSettingsModal()">⚙️ Настройки</button>
    </div>
</div>
