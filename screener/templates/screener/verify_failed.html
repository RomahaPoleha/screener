{% extends 'screener/base.html' %}
{% load static %}

{% block content %}
<div class="container d-flex align-items-center justify-content-center min-vh-100">
    <div class="card shadow-sm w-100" style="max-width: 420px;">
        <div class="card-body p-4 p-md-5 text-center">
            <div class="mb-4">
                <img src="{% url 'api_logo' %}" alt="Logo" height="56" class="mb-3">
            </div>

            <div class="mb-4">
                <div class="d-inline-flex align-items-center justify-content-center bg-danger-subtle text-danger rounded-circle" style="width:80px; height:80px;">
                    <svg width="36" height="36" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
                </div>
            </div>

            <h3 class="fw-bold mb-2">Ссылка недействительна</h3>
            <p class="text-muted mb-4">Срок действия истёк (24 часа) или ссылка уже использована.</p>

            <a href="{% url 'register' %}" class="btn btn-primary btn-lg w-100 mb-2" style="background:#f59e0b; border:none; color:#000; font-weight:700; text-transform:uppercase; letter-spacing:0.5px;">Зарегистрироваться снова</a>
            <a href="{% url 'login' %}" class="btn btn-outline-secondary btn-lg w-100" style="border-color:#333; color:#ccc;">Уже есть аккаунт — войти</a>
        </div>
    </div>
</div>

<style>
    .min-vh-100 { min-height: 100vh; }
</style>
{% endblock %}
