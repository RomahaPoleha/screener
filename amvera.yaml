meta:
  environment: python
  toolchain:
    name: pip
    version: "3.11"

build:
  requirementsPath: requirements.txt
  useCache: true

run:
  # start.py selects web/worker using PROCESS_TYPE.
  command: python start.py
  containerPort: 8000
  persistenceMount: /app/data

services:
  redis:
    image: redis:alpine
    resources:
      memory: 128M
      cpu: 0.25
