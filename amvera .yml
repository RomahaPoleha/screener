meta:
  environment: python
  toolchain:
    name: pip
    version: "3.11"

build:
  requirementsPath: requirements.txt
  useCache: true
  preBuild:
    - python manage.py collectstatic --noinput  # <-- Добавь эти две строки

run:
  command: daphne -b 0.0.0.0 -p 8000 config.asgi:application
  persistenceMount: /app/data
  env:
    - name: DJANGO_SETTINGS_MODULE
      value: config.settings
    - name: PYTHONUNBUFFERED
      value: "1"
    - name: AMVERA
      value: "1"

services:
  redis:
    image: redis:alpine
    resources:
      memory: 128M
      cpu: 0.25