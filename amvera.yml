meta:
  environment: python
  toolchain:
    name: pip
    version: "3.11"

build:
  requirementsPath: requirements.txt
  useCache: true

run:
  command: daphne -b 0.0.0.0 -p 8000 config.asgi:application
  containerPort: 8000          # ← добавил, чтобы Amvera знал, на какой порт слать трафик
  persistenceMount: /app/data
  # env — УБРАНО отсюда!

services:
  redis:
    image: redis:alpine
    resources:
      memory: 128M
      cpu: 0.25